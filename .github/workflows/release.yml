name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX, vX.Y, or vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){0,2}$ ]] || {
            echo "::error::tag must use vX, vX.Y, or vX.Y.Z format"
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Fail fast, before any build, when the tag and pyproject.toml disagree
      # or CHANGELOG.md has no section for the version.
      - name: Check version and extract release notes
        run: python .github/scripts/release_notes.py "$TAG" release-notes.md
      - name: Install test and build tools
        run: python -m pip install -e '.[dev]'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run mypy
        run: python -m mypy openclaw
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the wheel
        run: .github/scripts/smoke-test-wheel.sh dist/*.whl
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create or update GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "$TAG" --notes-file release-notes.md
          fi

