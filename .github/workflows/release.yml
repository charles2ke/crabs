name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag must use vX.Y.Z format"
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test and build tools
        run: python -m pip install -e '.[dev]' build==1.3.0
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run mypy
        run: python -m mypy openclaw
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          name: distributions
          path: dist
      - name: Extract release notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["TAG"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{version}]"
          try:
              start = changelog.index(heading)
          except ValueError:
              raise SystemExit(f"CHANGELOG.md has no {heading} section")
          start = changelog.index("\n", start) + 1
          end = changelog.find("\n## [", start)
          references = changelog.find("\n[Unreleased]:", start)
          boundaries = [value for value in (end, references) if value != -1]
          notes = changelog[start:min(boundaries) if boundaries else None].strip()
          if not notes:
              raise SystemExit(f"{heading} has no release notes")
          Path("/tmp/release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
      - name: Create or update GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" --notes-file /tmp/release-notes.md
          fi

# Trusted Publishing requires PyPI project and GitHub environment setup first.
# Once configured, enable a separate job after `release` with `id-token: write`:
#
#  publish-pypi:
#    needs: release
#    environment: pypi
