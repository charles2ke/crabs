[build-system]
# 77 is the first release with PEP 639 license expressions and license-files.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw"
version = "1.1.0"
description = "Open Claw: watch Schengen visa appointment slots and alert on availability."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["schengen", "visa", "appointment", "monitor", "notifications"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/charles2ke/crabs"
Documentation = "https://github.com/charles2ke/crabs/tree/main/docs"
Changelog = "https://github.com/charles2ke/crabs/blob/main/CHANGELOG.md"
Issues = "https://github.com/charles2ke/crabs/issues"

[project.scripts]
openclaw = "openclaw.cli:main"

[project.optional-dependencies]
dev = ["mypy==2.4.1", "build==1.6.1"]

[tool.setuptools]
packages = ["openclaw", "openclaw.providers"]

[tool.mypy]
python_version = "3.10"
files = ["openclaw"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "openclaw.locking"
warn_unreachable = false
